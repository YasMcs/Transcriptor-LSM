<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper API - Prueba de Transcripción</title>
    <!-- Enlace a los estilos CSS externos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Transcriptor LSM</h1>
            <p class="subtitle">Transcripción en tiempo real para clases en Lengua de Señas Mexicana.</p>
            <div class="header-controls">
                <select id="languageSelect" class="form-select">
                    <option value="es">🇲🇽 Español</option>
                    <option value="en">🇺🇸 Inglés</option>
                </select>
                <button id="recordBtn" class="btn-record">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                    Grabar
                </button>
                <button id="stopBtn" class="btn-stop" disabled>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M6 6h12v12H6z" />
                    </svg>
                    Detener
                </button>
            </div>
            <div id="status" class="status">Listo para grabar.</div>
        </div>

        <div class="textareas-container">
            <div class="input-group" id="container-original">
                <label for="transcription" id="label-transcription">Transcripción Original</label>
                <textarea id="transcription" placeholder="El texto del profesor aparecerá aquí..." readonly></textarea>
            </div>

            <div class="input-group" id="container-translation" style="display: none;">
                <label for="translationText">Traducción al Español</label>
                <textarea id="translationText" placeholder="Traducción al español..." readonly></textarea>
            </div>

            <div class="input-group">
                <label for="simplifiedText">LSM — Tiempo · Lugar · Sujeto · Objeto · Verbo</label>
                <textarea id="simplifiedText" placeholder="Aquí aparecerá el texto simplificado para LSM..."
                    readonly></textarea>
            </div>
        </div>
    </div>

    <!-- Enlace a la lógica JS externa -->
    <script src="app.js"></script>
</body>

</html>
